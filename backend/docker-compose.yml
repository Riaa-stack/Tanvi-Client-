version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: eduarchive-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: eduarchive
      POSTGRES_PASSWORD: eduarchive_password
      POSTGRES_DB: eduarchive_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eduarchive -d eduarchive_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eduarchive-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://eduarchive:eduarchive_password@postgres:5432/eduarchive_db
      SECRET_KEY: ${SECRET_KEY:-super-secret-key-change-in-production-32chars}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-jwt-super-secret-key-change-in-production-32chars}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      FLASK_ENV: production
      DEBUG: "false"
      CORS_ORIGINS: "*"
      UPLOAD_DIRECTORY: /app/storage/uploads
      CHROMA_PERSIST_DIRECTORY: /app/storage/chroma
      OCR_ENABLED: "true"
      EMBEDDING_MODEL: all-MiniLM-L6-v2
    ports:
      - "5000:5000"
    volumes:
      - storage_data:/app/storage

volumes:
  postgres_data:
  storage_data:
